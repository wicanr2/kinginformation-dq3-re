plugins { id 'com.android.application' }
android {
    namespace 'com.wicanr2.dq3'
    // Docker 工具鏈提供 SDK 35；targetSdk 維持 34，避免改變既有執行期行為。
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.wicanr2.dq3'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])  // ebitenmobile bind 產出 dq3.aar
}

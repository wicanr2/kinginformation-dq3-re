name: android

# Ebiten port → Android APK(ebitenmobile bind → .aar → gradle assembleDebug)。
# 版權素材 gitignore 不入庫:
#   - 不帶素材 → 仍會編出 .aar + APK(引擎可裝,但無遊戲資料 → 黑畫面),證明工具鏈通。
#   - 要能玩:設 repo secret DQ3_ASSETS_ZIP_B64 =(assets_raw + mt32/ 打包成 zip 再 base64)。
#     workflow 會解壓進 mobile/assets/ 再綁定 → 完整 APK。
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install ebitenmobile
        run: go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.9.9

      - name: Inject assets (private source)
        env:
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}      # 私有素材 repo 的 read PAT
          ASSETS_REPO: ${{ vars.ASSETS_REPO }}       # 例:wicanr2/dq3-assets(私有)
          ASSETS_B64: ${{ secrets.DQ3_ASSETS_ZIP_B64 }} # 後備:小素材集 base64(<48KB)
        run: |
          cd dq3_remake_ebitan
          if [ -n "$ASSETS_PAT" ] && [ -n "$ASSETS_REPO" ]; then
            # 私有 repo 拉素材(不進公開 repo,符合版權硬規則)。素材含 assets_raw + mt32/(可選)
            git clone --depth 1 "https://x-access-token:${ASSETS_PAT}@github.com/${ASSETS_REPO}.git" /tmp/assets
            rm -rf /tmp/assets/.git
            cp -a /tmp/assets/. mobile/assets/
            echo "私有 repo 帶入素材:$(ls mobile/assets | wc -l) 檔、MT-32 $(ls mobile/assets/mt32/*.ogg 2>/dev/null | wc -l) 軌"
          elif [ -n "$ASSETS_B64" ]; then
            echo "$ASSETS_B64" | base64 -d > /tmp/assets.zip
            unzip -o -q /tmp/assets.zip -d mobile/assets/
            echo "base64 帶入素材:$(ls mobile/assets | wc -l) 檔"
          else
            echo "未設素材來源 → 引擎-only APK(可裝,黑畫面)。設 ASSETS_PAT+ASSETS_REPO(私有)→ 完整 APK"
          fi

      - name: ebitenmobile bind → .aar
        run: |
          cd dq3_remake_ebitan
          mkdir -p android/app/libs
          "$(go env GOPATH)/bin/ebitenmobile" bind \
            -target android -androidapi 21 \
            -javapkg com.wicanr2.dq3 \
            -o android/app/libs/dq3.aar ./mobile
          ls -la android/app/libs/dq3.aar

      - name: Build APK (gradle assembleDebug)
        run: |
          cd dq3_remake_ebitan/android
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dq3-android
          path: |
            dq3_remake_ebitan/android/app/build/outputs/apk/debug/*.apk
            dq3_remake_ebitan/android/app/libs/dq3.aar
          if-no-files-found: warn
